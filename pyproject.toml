[project]
name = "animal-classifier"
version = "0.1.0"
description = "Detect, classify and file safari photographs by animal species"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer==0.27.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "timm==1.0.29",
    "numpy==2.5.3",
    "yolov5==7.0.14",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pillow-heif==1.7.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.39.0",
    "httpx==0.28.1",
    # yolov5 7.0.14 still imports pkg_resources, which setuptools 81 removed.
    "setuptools==80.10.2",
]

[project.optional-dependencies]
raw = ["rawpy==0.27.1"]

# The test runner is tooling, not a feature of the shipped package, so it is a
# PEP 735 dependency group rather than an extra. uv installs the `dev` group by
# default, which is what makes the canonical gate command
# `uv run --frozen pytest tests/e2e -q` resolve on a clean machine; as an extra it
# only worked because the local venv already had pytest.
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.14.1"]

[tool.ruff]
# The lint gate F23 asked for: a deliberate ruleset pinned in-repo so a 26-chunk
# build reviewed by reading diffs has a mechanical backstop. Run: `uv run --frozen
# ruff check`.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "PLC", "RUF"]
# B008 is typer's Argument/Option-in-default idiom (the documented pattern);
# PLC0415 (import-outside-top-level) is our deliberate lazy-import strategy for the
# torch-heavy modules; E501 (line length) is relaxed for the prose-heavy docstrings
# this project uses to record design intent; RUF002/RUF003 flag unicode (§, ×, →)
# that appears on purpose in those docstrings. All intentional and codebase-wide.
ignore = ["B008", "PLC0415", "E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures after a sys.path insert, and use assert freely.
"tests/**" = ["E402"]
"scripts/**" = ["E402"]

[project.scripts]
animal-classifier = "animal_classifier.cli:app"

[tool.uv]
# Three transitive dependencies of yolov5 are hostile to this environment and are
# unused by our code path (DESIGN.md §2.1). A marker that can never be true drops
# the requirement from the resolution entirely.
#   opencv-python  -> imports libGL.so.1, absent from this image
#   roboflow       -> pins typer<0.26 / opencv-python-headless==4.10.0.84
#   sahi           -> requires opencv-python>=4.12.0.88, re-introducing the first
override-dependencies = [
    "opencv-python; python_version < '3.0'",
    "roboflow; python_version < '3.0'",
    "sahi; python_version < '3.0'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_classifier"]
# The static taxonomy tables are data the package cannot run without (no species API
# is reachable, DESIGN.md §13.3), so they are named explicitly rather than left to
# hatchling's default file selection, which honours .gitignore and had silently
# dropped them.
artifacts = [
    "src/animal_classifier/taxonomy/data/*.csv",
    "src/animal_classifier/gui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
addopts = "-ra"
markers = [
    "slow: end-to-end test that trains a model or runs the real detector over many frames",
]
